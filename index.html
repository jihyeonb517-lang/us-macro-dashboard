<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미국 주식 매크로 | US Macro Observatory</title>
<style>
:root{--ink:#182a3b;--muted:#5e7080;--line:#d6e0e7;--paper:#f4f7fa;--accent:#007d83;--navy:#142c40;--warn:#a66313}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #dd9d35;outline-offset:4px}header{background:white;border-bottom:1px solid var(--line)}.head{max-width:1440px;margin:auto;padding:26px 36px;display:flex;align-items:center;justify-content:space-between;gap:24px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent)}h1{margin:4px 0 0;font-size:25px;letter-spacing:-1px}.stamp{font-size:13px;color:var(--muted);text-align:right}.wrap{max-width:1440px;margin:auto;padding:0 36px 36px}.tabs{display:flex;gap:32px;border-bottom:1px solid var(--line);margin-bottom:26px}.tabs button{padding:20px 0 15px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-weight:700}.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}.intro{display:flex;align-items:start;justify-content:space-between;gap:24px;margin-bottom:22px}h2{margin:0;font-size:22px}.intro p{color:var(--muted);margin:6px 0 0}.badge{font-size:13px;padding:5px 10px;border:1px solid var(--line);white-space:nowrap;background:white}.badge.warn{color:var(--warn);border-color:#dcc5a6}.reading{background:var(--navy);color:white;padding:20px 24px;display:flex;gap:26px;margin-bottom:26px}.reading strong{font-size:13px;white-space:nowrap;color:#72d1ce;letter-spacing:1px}.reading p{margin:0;font-size:16px}.workspace{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}.metric-list{display:flex;flex-direction:column;gap:0;background:white;border:1px solid var(--line)}.metric{background:transparent;border:0;border-bottom:1px solid var(--line);padding:17px 18px;text-align:left;color:var(--ink);border-left:4px solid transparent}.metric:last-child{border-bottom:0}.metric[aria-pressed=true]{background:#e9f3f3;border-left-color:var(--accent)}.metric:hover{background:#eff5f7}.metric .name{display:block;font-size:14px;font-weight:700}.metric .value{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;display:block;margin-top:3px}.metric .unit{font-size:13px;font-weight:400;margin-left:5px;color:var(--muted)}.metric .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}.panel{background:white;border:1px solid var(--line);padding:25px 28px}.panel-top{display:flex;justify-content:space-between;align-items:start;gap:20px}.panel h3{font-size:20px;margin:0}.latest{font-size:34px;line-height:1.4;font-weight:700;letter-spacing:-1px}.latest small{font-size:15px;margin-left:6px;color:var(--muted);font-weight:400;letter-spacing:0}.delta{color:var(--muted);font-size:14px;margin-top:3px}.periods{display:flex;gap:3px;flex-wrap:wrap;justify-content:end}.periods button{background:none;border:1px solid transparent;padding:5px 9px;font-size:13px;color:var(--muted)}.periods button.active{background:var(--navy);color:white}.chart-wrap{position:relative;margin-top:18px}.chart{width:100%;height:auto;display:block;overflow:visible}.hover{height:25px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}.legend{display:flex;gap:20px;font-size:13px;color:var(--muted);margin:8px 0;flex-wrap:wrap}.key{display:inline-block;width:18px;height:3px;margin-right:7px;vertical-align:middle;background:var(--accent)}.key.alt{background:#a36c22}.chart-range{font-size:12px;color:var(--muted);text-align:right}.note{border-top:1px solid var(--line);margin-top:16px;padding-top:15px;color:var(--muted);font-size:14px}.quality{margin-top:18px;color:var(--warn);font-size:14px}.sources{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}summary{cursor:pointer;font-weight:700;font-size:14px}.formula{font-size:14px;padding:10px 0;color:var(--muted)}.source{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}.source a{color:var(--accent);font-weight:700}.source span{display:block;color:var(--muted)}.method{margin-top:28px;font-size:13px;color:var(--muted);max-width:1060px}.foot{border-top:1px solid var(--line);margin-top:22px;padding-top:16px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:20px}noscript{display:block;padding:30px}.empty{padding:80px 20px;text-align:center;color:var(--muted)}@media(max-width:1000px){.workspace{grid-template-columns:245px 1fr}.panel{padding:20px}.panel-top{flex-direction:column}.periods{justify-content:start}}@media(max-width:720px){.head{padding:18px 20px;align-items:start}.stamp{max-width:140px;font-size:12px}.wrap{padding:0 18px 24px}.tabs{gap:20px}.tabs button{font-size:14px}.intro{display:block}.intro .badge{display:inline-block;margin-top:12px}.reading{display:block;padding:18px}.reading p{margin-top:6px;font-size:14px}.workspace{grid-template-columns:1fr}.metric-list{display:grid;grid-template-columns:1fr 1fr}.metric{padding:12px;border-bottom:1px solid var(--line)}.metric .value{font-size:22px}.metric .meta{display:block}.metric .meta span{display:block}.metric:last-child{grid-column:1/-1}.source{grid-template-columns:1fr}.latest{font-size:30px}.foot{display:block}.panel{padding:18px}.chart-wrap{margin-top:8px}.chart-range{text-align:left}}
</style></head><body>
<header><div class="head"><div><div class="eyebrow">US MACRO OBSERVATORY</div><h1>미국 주식 매크로</h1></div><div class="stamp" id="stamp"></div></div></header>
<main class="wrap"><nav class="tabs" role="tablist" aria-label="매크로 화면"><button role="tab" id="tab-economy" data-section="economy" aria-selected="true" aria-controls="content">01 경기·물가</button><button role="tab" id="tab-conditions" data-section="conditions" aria-selected="false" aria-controls="content" tabindex="-1">02 금융 여건</button><button role="tab" id="tab-market" data-section="market" aria-selected="false" aria-controls="content" tabindex="-1">03 시장 반응</button></nav>
<section id="content" role="tabpanel" aria-labelledby="tab-economy"><div class="intro"><div><h2 id="section-title"></h2><p id="section-description"></p></div><span class="badge" id="coverage"></span></div><div class="reading"><strong>최근 변화</strong><p id="reading"></p></div><div class="workspace"><div class="metric-list" id="metrics" aria-label="지표 선택"></div><article class="panel" id="panel"></article></div></section>
<div class="method"><strong>읽는 기준</strong><br>점수 하나로 시장을 판정하지 않습니다. 수준과 최근 변화, 서로 다른 지표의 방향을 함께 확인하세요. <span id="method"></span> 자료가 오래되거나 없으면 이전 값을 현재 값으로 바꾸지 않고 상태를 표시합니다.</div><footer class="foot"><span>원자료 → 계산 → 표시를 분리한 매크로 관측 도구</span><span>매일 12:00 UTC 자동 수집 예정 · 실제 관측일과 자료 상태를 확인하세요.</span></footer></main><noscript>이 대시보드에는 JavaScript가 필요합니다.</noscript>
<script>
'use strict';
(async () => {
document.querySelectorAll('[data-section]').forEach(b => b.disabled = true);
const response = await fetch('./data.json', {cache: 'no-store'});
if (!response.ok) throw new Error('Data request failed: ' + response.status);
const DATA = await response.json();
if (!Array.isArray(DATA.metrics) || DATA.metrics.length !== 15) throw new Error('Invalid dashboard data');
const sections={economy:{title:'성장과 물가의 방향',description:'노동시장의 변화와 물가 상승 속도를 함께 읽습니다.'},conditions:{title:'유동성과 자금 조달 여건',description:'자금의 양과 시장이 요구하는 위험 보상을 구분합니다.'},market:{title:'주식과 금리시장의 반응',description:'추세·위험 인식·상승 참여를 각각 확인합니다.'}};
let section='economy',selected='jobs',years=5;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=2)=>v==null?'—':new Intl.NumberFormat('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d}).format(v);
const fmt=m=>num(m.value,['천 명','천 건','십억 달러','bp'].includes(m.unit)?1:2);
const deltaUnit=m=>m.unit==='%'?'%p':m.unit;
const changeText=m=>m.delta==null?'비교 자료 부족':`${m.delta>0?'+':''}${num(m.delta,2)} ${deltaUnit(m)}`;
const dateText=m=>m.sources.every(s=>s.frequency==='monthly')?m.date?.slice(0,7):m.date;
function directional(id){const m=DATA.metrics.find(m=>m.id===id);if(!m||m.status!=='ok'||m.delta==null)return `${m?.title||id}: 판단 제한`;return `${m.title} ${changeText(m)} (${m.period})`;}
function reading(){const ids={economy:['jobs','unemployment','pce'],conditions:['netliq','repo','credit'],market:['trend','participation','real']}[section];return ids.map(directional).join(' · ');}
function render(){
 document.querySelectorAll('[data-section]').forEach(b=>{const yes=b.dataset.section===section;b.setAttribute('aria-selected',yes);b.tabIndex=yes?0:-1});
 $('content').setAttribute('aria-labelledby','tab-'+section);
 $('section-title').textContent=sections[section].title;$('section-description').textContent=sections[section].description;
 const list=DATA.metrics.filter(m=>m.section===section),valid=list.filter(m=>m.status==='ok').length;
 $('coverage').textContent=`${list.length}개 지표 · ${valid===list.length?'자료 유효기간 내':(list.length-valid)+'개 확인 필요'}`;$('coverage').className='badge'+(valid<list.length?' warn':'');
 $('reading').textContent=reading();
 $('metrics').innerHTML=list.map(m=>`<button class="metric" data-metric="${esc(m.id)}" aria-pressed="${m.id===selected}"><span class="name">${esc(m.title)}</span><span class="value">${fmt(m)}<span class="unit">${esc(m.unit)}</span></span><span class="meta"><span>${esc(dateText(m)||'기준일 없음')}</span><span>${m.status==='ok'?esc(changeText(m)):m.status==='stale'?'오래된 자료':'자료 없음'}</span></span></button>`).join('');
 document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{selected=b.dataset.metric;render()});renderPanel();
}
function renderPanel(){const m=DATA.metrics.find(m=>m.id===selected);const source=m.sources.map(s=>`<div class="source"><div><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.id)} ↗</a><span>${esc(s.origin)}</span></div><div><span>원자료 관측일 ${esc(s.observed||'없음')} · ${esc({daily:'일간',weekly:'주간',monthly:'월간'}[s.frequency]||s.frequency)}</span><span>수집 ${s.retrieved?esc(new Date(s.retrieved).toLocaleString('ko-KR')):'시각 미확인 · 기존 캐시'}</span><span>관측일 경과 ${s.age??'—'}일 / 유효기간 ${s.maxAge}일${s.fallback?' · 이전 유효 자료 사용':''}</span></div></div>`).join('');
 $('panel').innerHTML=`<div class="panel-top"><div><h3>${esc(m.title)}</h3><div class="latest">${fmt(m)}<small>${esc(m.unit)}</small></div><div class="delta">${esc(m.period)} ${esc(changeText(m))} · 기준 ${esc(dateText(m)||'없음')}</div></div><div class="periods" aria-label="차트 기간">${[1,3,5,10,0].map(n=>`<button data-years="${n}" aria-pressed="${years===n}" class="${years===n?'active':''}">${n?n+'년':'전체'}</button>`).join('')}</div></div><div class="legend"><span><i class="key"></i>${m.secondary?'전년 대비':esc(m.title)}</span>${m.secondary?`<span><i class="key alt"></i>${esc(m.secondary.label)}</span>`:''}</div><div class="chart-wrap" id="chart-wrap"><div class="hover" id="hover" aria-live="off">차트 위에서 날짜별 값을 확인하세요.</div><div id="chart"></div></div><div class="chart-range" id="chart-range"></div>${m.status!=='ok'?`<p class="quality">${m.status==='stale'?'최신성을 확인할 수 없어 마지막 관측값을 참고용으로 표시합니다.':'필수 자료가 없어 값을 계산하지 않았습니다.'}</p>`:''}<p class="note">${esc(m.note)}</p><details class="sources"><summary>계산식·출처·자료 상태</summary><div class="formula">${esc(m.formula)}</div>${source}</details>`;
 document.querySelectorAll('[data-years]').forEach(b=>b.onclick=()=>{years=+b.dataset.years;renderPanel()});draw(m);
}
function draw(m){
 const ts=d=>Date.parse(d+'T00:00:00Z');const all=m.points.filter(p=>p[1]!=null);
 if(!all.length){$('chart').innerHTML='<div class="empty">표시할 관측 자료가 없습니다.</div>';$('chart-range').textContent='';return;}
 const end=ts(all[all.length-1][0]),cut=years?end-years*365.25*86400000:-Infinity;
 const primary=m.points.filter(p=>ts(p[0])>=cut&&ts(p[0])<=end);
 const alternate=(m.secondary?.points||[]).filter(p=>ts(p[0])>=Math.max(cut,ts(primary[0][0]))&&ts(p[0])<=end);
 const vals=[...primary,...alternate].filter(p=>p[1]!=null);let min=Math.min(...vals.map(p=>p[1])),max=Math.max(...vals.map(p=>p[1]));
 let pad=(max-min)*.12||Math.max(Math.abs(max)*.03,1);min-=pad;max+=pad;
 const start=ts(primary[0][0]),span=end-start||86400000,W=850,H=345,L=70,R=20,T=26,B=40;
 const x=d=>L+(ts(d)-start)/span*(W-L-R),y=v=>T+(max-v)/(max-min)*(H-T-B);
 let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.title)} · ${esc(m.unit)} · ${primary[0][0]}부터 ${all[all.length-1][0]}까지"><title>${esc(m.title)} (${esc(m.unit)})</title><text x="${L}" y="15" fill="#5e7080" font-size="12">${esc(m.unit)}</text>`;
 for(let i=0;i<5;i++){const v=min+(max-min)*i/4,yy=y(v);svg+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e2e9ee"/><text x="${L-12}" y="${yy+4}" text-anchor="end" fill="#5e7080" font-size="12">${num(v,Math.abs(v)>100?0:1)}</text>`;}
 if(min<0&&max>0)svg+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#8ba1b0" stroke-dasharray="4 4"/>`;
 for(let i=0;i<5;i++){const d=new Date(start+span*i/4).toISOString().slice(0,10);svg+=`<text x="${L+(W-L-R)*i/4}" y="${H-12}" text-anchor="${i===0?'start':i===4?'end':'middle'}" fill="#5e7080" font-size="12">${d.slice(0,7)}</text>`;}
 function path(points,color){let p='',move=true;for(const [d,v]of points){if(v==null){move=true;continue}p+=(move?'M':'L')+x(d).toFixed(2)+','+y(v).toFixed(2)+' ';move=false}return `<path d="${p}" stroke="${color}" fill="none" stroke-width="2" vector-effect="non-scaling-stroke"/>`;}
 svg+=path(primary,'#007d83')+path(alternate,'#a36c22');svg+=`<line id="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#8ba1b0" stroke-dasharray="3 3" visibility="hidden"/><circle id="dot" r="4" fill="#007d83" visibility="hidden"/><rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg>`;
 $('chart').innerHTML=svg;$('chart-range').textContent=`표시 기간 ${primary[0][0]} — ${all[all.length-1][0]} · 관측일 기준`;
 const good=primary.filter(p=>p[1]!=null),chart=$('chart').querySelector('svg');
 $('hit').onpointermove=e=>{const rect=chart.getBoundingClientRect(),px=(e.clientX-rect.left)/rect.width*W;let point=good.reduce((a,b)=>Math.abs(x(b[0])-px)<Math.abs(x(a[0])-px)?b:a);const cross=$('cross'),dot=$('dot');cross.setAttribute('x1',x(point[0]));cross.setAttribute('x2',x(point[0]));cross.setAttribute('visibility','visible');dot.setAttribute('cx',x(point[0]));dot.setAttribute('cy',y(point[1]));dot.setAttribute('visibility','visible');const other=alternate.find(p=>p[0]===point[0]);$('hover').textContent=`${point[0]} · ${num(point[1])} ${m.unit}`+(other&&other[1]!=null?` · ${m.secondary.label} ${num(other[1])} ${m.unit}`:'');};
 $('hit').onpointerleave=()=>{$('cross').setAttribute('visibility','hidden');$('dot').setAttribute('visibility','hidden');};
}
document.querySelectorAll('[data-section]').forEach((b,i)=>{b.onclick=()=>{section=b.dataset.section;selected=DATA.metrics.find(m=>m.section===section).id;render()};b.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('[data-section]')],next=tabs[(i+(e.key==='ArrowRight'?1:2))%3];next.click();next.focus();}}});
document.querySelectorAll('[data-section]').forEach(b => b.disabled = false);
$('stamp').textContent='최근 수집 '+new Date(DATA.generatedAt).toLocaleString('ko-KR');$('method').textContent=DATA.method;render();
})().catch(error => {
 console.error(error);
 document.getElementById('stamp').textContent = '자료를 불러오지 못했습니다.';
 document.getElementById('panel').textContent = '데이터를 불러올 수 없습니다. 잠시 후 페이지를 새로고침해 주세요.';
});
</script></body></html>
