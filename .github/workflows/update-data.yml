name: Update data and deploy dashboard

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: macro-dashboard-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test formulas and fallback handling
        run: python -m unittest discover -s tests -v
      - name: Refresh observations
        id: refresh
        continue-on-error: true
        timeout-minutes: 4
        run: python -u fetch_data.py
      - name: Validate deployable JSON
        run: python -m unittest discover -s tests -p test_artifact.py -v
      - name: Commit data and durable fallback cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json cache/observations.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update macro observations'
            git push origin HEAD:main
          fi
      - name: Stage public files only
        run: |
          mkdir -p _site
          cp index.html data.json _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report total fetch outage after publishing fallback
        if: steps.refresh.outcome == 'failure'
        run: |
          echo '::error::Refresh failed. Preserved data was deployed; inspect source errors above.'
          exit 1
